name: Export Biology Unit 1 (one-off)

# Reads the English Biology Unit 1 questions into the job log for their
# Gujarati versions. Only on this working branch; never on main. Reads only.
on:
  push:
    branches: [claude/project-thread-umv1js]
    paths: ['scripts/export-sample/**', '.github/workflows/export-sample.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/export-sample/export.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
