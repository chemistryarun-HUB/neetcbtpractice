name: Deploy Doubt Desk function

# Deploys supabase/functions/doubt-helper to the same Supabase project the
# site uses, and stores the Claude API key as that function's secret.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  from supabase.com → Account → Access Tokens
#   ANTHROPIC_API_KEY      from console.anthropic.com → API Keys
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-doubt-function.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN or ANTHROPIC_API_KEY secret is missing; Doubt Desk function not deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.ok == 'true'
        with:
          version: 2.119.0
      - name: Deploy
        if: steps.check.outputs.ok == 'true'
        run: |
          REF=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase secrets set ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" --project-ref "$REF"
          # The function checks the student's own Doubt Desk token itself.
          supabase functions deploy doubt-helper --project-ref "$REF" --no-verify-jwt
