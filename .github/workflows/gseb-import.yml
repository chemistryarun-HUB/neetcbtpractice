name: GSEB papers import (one-off)

# Runs scripts/gseb-import/import.mjs with the same Supabase secrets the
# deploy uses. Only on this working branch; never on main. Safe to re-run:
# papers that already have questions are left alone.
on:
  push:
    branches: [claude/project-thread-2ftyoa]
    paths: ['scripts/gseb-import/**', '.github/workflows/gseb-import.yml']

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Dry run (reads only) until scripts/gseb-import/APPLY is committed.
      - run: node scripts/gseb-import/import.mjs $( [ -f scripts/gseb-import/APPLY ] && echo --apply )
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
