name: Bio Units 2-10 import (one-off)
on:
  push:
    branches: [claude/project-thread-mdjfk0]
    paths: [scripts/bio-import/**, .github/workflows/bio-import.yml]
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/bio-import/import-u2to10.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
