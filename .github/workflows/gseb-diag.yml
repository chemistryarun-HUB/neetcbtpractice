name: GSEB chapter-wise diagnostic (read-only)

# Branch-only; never on main.
on:
  push:
    branches: [claude/project-thread-ewo95d]
    paths: ['scripts/gseb-diag/**', '.github/workflows/gseb-diag.yml']

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/gseb-diag/run.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
