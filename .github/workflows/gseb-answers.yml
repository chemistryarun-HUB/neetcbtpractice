name: GSEB model answers (one-off)

# Read-only dump of the Chemistry Part B questions (no database writes);
# the dump is committed back to this branch under gseb-dump/ so it can be read.
on:
  push:
    branches: [claude/project-thread-2ftyoa]
    paths: ['scripts/gseb-answers/**', '.github/workflows/gseb-answers.yml']

permissions:
  contents: write

jobs:
  answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: mkdir -p gseb-dump && node scripts/gseb-answers/dump-partb.mjs chemistry > gseb-dump/chemistry.txt
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gseb-dump && git commit -m "Dump of Chemistry Part B questions (read-only)" && git push
