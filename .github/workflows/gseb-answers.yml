name: GSEB model answers (one-off)

# Replaces the 7 Chemistry 2024 Main Part B answers with NCERT-worded ones.
# Only on this working branch; never on main. Dry run until
# scripts/gseb-answers/APPLY is committed.
on:
  push:
    branches: [claude/project-thread-2ftyoa]
    paths: ['scripts/gseb-answers/**', '.github/workflows/gseb-answers.yml']

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/gseb-answers/apply-ncert7.mjs $( [ -f scripts/gseb-answers/APPLY ] && echo --apply )
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
