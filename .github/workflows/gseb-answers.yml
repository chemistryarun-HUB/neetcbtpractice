name: GSEB model answers (one-off)

# Writes the NCERT-based Chemistry Part B model answers. Dry run unless
# scripts/gseb-answers/APPLY exists. Removed from the branch after it has run.
on:
  push:
    branches: [claude/project-thread-2ftyoa]
    paths: ['scripts/gseb-answers/**', '.github/workflows/gseb-answers.yml']

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/gseb-answers/apply-chem-all.mjs $([ -f scripts/gseb-answers/APPLY ] && echo --apply)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
