name: NEET LaTeX pass (one-off)

# Saves the Unit 7 LaTeX text (after an encrypted backup of the rows, pushed
# to the claude/neet-latex-data branch). Only on this working branch.
on:
  push:
    branches: [claude/project-thread-ewo95d]
    paths: ['scripts/neet-latex/**', '.github/workflows/neet-latex.yml']

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/neet-latex/update.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - run: |
          cd out
          git init -q -b claude/neet-latex-data
          git add backup.enc backup.key result.txt
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "backup + result"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" claude/neet-latex-data
