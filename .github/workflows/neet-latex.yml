name: NEET LaTeX pass (one-off)

# Reads Chemistry Unit 7 questions in batches. Only on this working branch.
on:
  push:
    branches: [claude/project-thread-ewo95d]
    paths: ['scripts/neet-latex/**', '.github/workflows/neet-latex.yml']

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/neet-latex/export.mjs ${{ matrix.batch }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
