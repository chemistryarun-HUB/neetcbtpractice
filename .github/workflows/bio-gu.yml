name: Add Gujarati Biology Unit 1 drafts (one-off)

# Inserts the Gujarati Unit 1 questions as unpublished drafts.
# Only on this working branch; never on main.
on:
  push:
    branches: [claude/project-thread-umv1js]
    paths: ['scripts/bio-gu/**', '.github/workflows/bio-gu.yml']

permissions:
  contents: read

jobs:
  insert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/bio-gu/insert.mjs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
